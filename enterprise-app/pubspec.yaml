name: enterprise_english
description: "Enterprise English Trainer — gamifikatsiyalangan, spaced-repetition ingliz tili ilovasi (o'zbeklar uchun)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  flutter_tts: ^4.2.0
  audioplayers: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/beginner/
    - assets/content/elementary/
    - assets/content/enterprise1/
    - assets/content/enterprise2/
    - assets/images/
    - assets/images/unit1/
    - assets/book_pages/
    - assets/sfx/
